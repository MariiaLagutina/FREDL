[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "Retrieval-Augmented Generation system for querying a codebase"
requires-python = ">=3.10"
dependencies = [
    "fire",
    "pydantic",
    "tqdm",
]

[dependency-groups]
dev = [
    "flake8",
    "mypy",
    "pytest",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true