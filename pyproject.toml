[project]
name = "fredl"
version = "0.1.0"
description = "A personal learning system that connects questions, sources, and later understanding"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "fire",
    "pydantic",
    "torch>=2.0",
    "tqdm",
    "transformers>=4.51,<5",
    "uvicorn",
]

[dependency-groups]
dev = [
    "flake8",
    "httpx2>=2.13.0",
    "mypy",
    "pytest",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
